# NanoPi R28S: AIC8800 SDIO WiFi driver options
#
# The AIC8800 out-of-tree driver hardcodes firmware dir /lib/firmware/aic8800/sdio,
# which is where this board's firmware files are installed (see rootfs/usr/lib/
# firmware/aic8800/sdio/). aic_fw_path is kept explicit for robustness in case a
# future driver build changes its default.
options aic8800_bsp aic_fw_path=/lib/firmware/aic8800/sdio
options aic8800_fdrv aicwf_dbg_level=0 custregd=0 ps_on=1
